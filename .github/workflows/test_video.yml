name: Ilk Video Uretim Testi

on:
  workflow_dispatch: # Bu satır, GitHub sitesinden "Çalıştır" butonuna elle basmamızı sağlar.

jobs:
  test-render:
    runs-on: ubuntu-latest

    steps:
    - name: Kodları Çek
      uses: actions/checkout@v4

    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # MoviePy'ın Linux sunucusunda yazı yazabilmesi için 'imagemagick' kurulmalıdır.
    - name: ImageMagick Kur (Yazı Ekleme İçin Şart)
      run: |
        sudo apt-get update
        sudo apt-get install -y imagemagick
        sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"/<policy domain="path" rights="read|write" pattern="@\*"/g' /etc/ImageMagick-6/policy.xml

    - name: Bağımlılıkları Yükle
      run: |
        pip install -r requirements.txt

    - name: Kodu Çalıştır ve Videoyu Üret
      run: python main.py

    # Üretilen videoyu GitHub arayüzünden bilgisayarımıza indirebilmemiz için saklar
    - name: Videoyu GitHub'a Yukle (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: test-videosu
        path: cikti_video.mp4
