name: Ilk Video Uretim Testi

on:
  workflow_dispatch:

# Node.js uyarısını ortadan kaldırmak için çevresel değişkeni zorluyoruz
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-render:
    runs-on: ubuntu-latest

    steps:
    - name: Kodları Çek
      uses: actions/checkout@v4

    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Bağımlılıkları Yükle
      run: |
        pip install -r requirements.txt

    - name: Kodu Çalıştır ve Videoyu Üret
      run: python main.py

    - name: Videoyu GitHub'a Yukle (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: test-videosu
        path: cikti_video.mp4
