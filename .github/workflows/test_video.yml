name: Ilk Video Uretim Testi

on:
  workflow_dispatch:

jobs:
  test-render:
    runs-on: ubuntu-latest

    steps:
    - name: Kodları Çek
      uses: actions/checkout@v4

    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Linux Sistem Paketlerini ve Fontları Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y imagemagick fontconfig fonts-dejavu-core
        # ImageMagick güvenlik politikasını düzenle
        sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"/<policy domain="path" rights="read|write" pattern="@\*"/g' /etc/ImageMagick-6/policy.xml

    - name: Bağımlılıkları Yükle
      run: |
        pip install -r requirements.txt

    - name: Kodu Çalıştır ve Videoyu Üret
      run: python main.py

    - name: Videoyu GitHub'a Yukle (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: test-videosu
        path: cikti_video.mp4
